<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" width="920" height="510" role="img" aria-labelledby="vizTitle vizDesc">
  <title id="vizTitle">Weekly Food Spending by UK Income Decile (Defra 2024/25)</title>
  <desc id="vizDesc">Horizontal grouped bar chart comparing weekly per-person food expenditure between the lowest 10% and highest 10% UK income households across five food categories.</desc>
  <rect width="920" height="510" fill="#FFFFFF"/>
  <line x1="0" y1="2" x2="920" y2="2" stroke="#121212" stroke-width="3"/>

  <!-- Header -->
  <text x="0" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#121212">Weekly food spending by income group (lowest 10% vs highest 10%)</text>
  <text x="0" y="58" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5F6368">Average expenditure in pounds (£) per person per week, UK 2024/25</text>

  <!-- Legend -->
  <rect x="0" y="76" width="14" height="12" fill="#E01A22"/>
  <text x="20" y="87" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#121212">Lowest 10% (Decile 1)</text>
  <rect x="205" y="76" width="14" height="12" fill="#121212"/>
  <text x="225" y="87" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#121212">Highest 10% (Decile 10)</text>

  <!-- Axis guide -->
  <line x1="240" y1="120" x2="240" y2="424" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="423.3" y1="120" x2="423.3" y2="424" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="606.6" y1="120" x2="606.6" y2="424" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="240" y="114" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#5F6368">£0</text>
  <text x="423.3" y="114" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#5F6368">£20</text>
  <text x="606.6" y="114" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#5F6368">£40</text>

  
    <g>
      
      
      <text x="8" y="158" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#121212">All food at home</text>
      <text x="8" y="176" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5F6368">+58.7% (1.59×)</text>
      <rect x="240" y="144" width="265.6" height="15" fill="#E01A22"/>
      <text x="513.6" y="156" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#E01A22">£28.98</text>
      <rect x="240" y="163" width="421.5" height="15" fill="#121212"/>
      <text x="669.5" y="175" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#121212">£45.98</text>
    </g>
    <g>
      <line x1="0" y1="190" x2="920" y2="190" stroke="#E5E7EB" stroke-width="1"/>
      
      <text x="8" y="216" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#121212">Eating out</text>
      <text x="8" y="234" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5F6368">+269.1% (3.69×)</text>
      <rect x="240" y="202" width="50.7" height="15" fill="#E01A22"/>
      <text x="298.7" y="214" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#E01A22">£5.53</text>
      <rect x="240" y="221" width="187.1" height="15" fill="#121212"/>
      <text x="435.1" y="233" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#121212">£20.41</text>
    </g>
    <g>
      <line x1="0" y1="248" x2="920" y2="248" stroke="#E5E7EB" stroke-width="1"/>
      
      <text x="8" y="274" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#121212">Convenience foods</text>
      <text x="8" y="292" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5F6368">+46.7% (1.47×)</text>
      <rect x="240" y="260" width="90.1" height="15" fill="#E01A22"/>
      <text x="338.1" y="272" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#E01A22">£9.83</text>
      <rect x="240" y="279" width="132.2" height="15" fill="#121212"/>
      <text x="380.2" y="291" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#121212">£14.42</text>
    </g>
    <g>
      <line x1="0" y1="306" x2="920" y2="306" stroke="#E5E7EB" stroke-width="1"/>
      <rect x="0" y="308" width="920" height="54" fill="#FDF0F0"/>
      <text x="8" y="332" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#121212">Fresh fruit &amp; veg</text>
      <text x="8" y="350" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5F6368">+59.6% (1.60×)</text>
      <rect x="240" y="318" width="34.3" height="15" fill="#E01A22"/>
      <text x="282.3" y="330" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#E01A22">£3.74</text>
      <rect x="240" y="337" width="54.7" height="15" fill="#121212"/>
      <text x="302.7" y="349" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#121212">£5.97</text>
    </g>
    <g>
      <line x1="0" y1="364" x2="920" y2="364" stroke="#E5E7EB" stroke-width="1"/>
      
      <text x="8" y="390" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#121212">Ready meals</text>
      <text x="8" y="408" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5F6368">+55.4% (1.55×)</text>
      <rect x="240" y="376" width="18.5" height="15" fill="#E01A22"/>
      <text x="266.5" y="388" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#E01A22">£2.02</text>
      <rect x="240" y="395" width="28.8" height="15" fill="#121212"/>
      <text x="276.8" y="407" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#121212">£3.14</text>
    </g>

  <!-- Reading Key (Simple rule, no card) -->
  <line x1="0" y1="436" x2="920" y2="436" stroke="#121212" stroke-width="1.5"/>
  <text x="0" y="458" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#E01A22">HOW TO READ:</text>
  <text x="102" y="458" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#222222">Richest households spend 1.60× more on fresh fruit &amp; veg (£5.97 vs £3.74) and 3.69× more eating out (£20.41 vs £5.53).</text>
  <text x="0" y="478" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5F6368">Both groups devote roughly 13% of home food spending to fresh produce, so lower budgets directly reduce volume.</text>
  <text x="0" y="502" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#8A8A8A">Source: Defra, Family Food 2024/25</text>
</svg>
